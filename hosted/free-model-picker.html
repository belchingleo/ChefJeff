<style>
#free-model-picker,#free-model-limits{width:min(560px,calc(100vw - 28px))}
#free-model-picker[hidden],#free-model-picker [hidden]{display:none!important}
#free-model-list{display:flex;flex-direction:column;border:3px solid var(--ink);margin:4px 0 12px}
#free-model-list button{display:flex;flex-direction:column;gap:2px;width:100%;padding:10px 14px;border:0;border-bottom:2px dashed #e3c79a;background:var(--paper);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
#free-model-list button:last-child{border-bottom:0}
#free-model-list button[aria-pressed=true]{background:var(--honey-tint,#fbe3b8)}
#free-model-list button:hover:not(:disabled){background:var(--honey-tint,#fbe3b8)}
#free-model-list button:disabled{opacity:.55;cursor:default}
#free-model-list .row{display:flex;justify-content:space-between;gap:12px;width:100%}
#free-model-list .name{font:17px/24px var(--pixel)}
#free-model-list .detail{font-size:13px;line-height:18px;color:var(--muted,#6e4e38)}
#free-model-list .status{font-size:13px;white-space:nowrap}
#free-model-list .open{color:var(--herb,#3c7a2a)}#free-model-list .full{color:#a8520e}#free-model-list .off{color:var(--muted,#6e4e38)}
.free-note{font-size:13px;line-height:20px;color:var(--muted,#6e4e38);margin:0 0 10px}
#free-model-limits ul{margin:0 0 12px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
</style>
<dialog id="free-model-picker" class="panel" aria-labelledby="free-model-title">
 <div class="dlg-head"><h2 id="free-model-title">免费模型</h2><button class="btn close" id="free-model-close" type="button" aria-label="返回">×</button></div>
 <div class="dlg-body">
  <p class="free-note" id="free-model-reason"></p>
  <div id="free-model-list" aria-label="免费模型"></div>
  <p class="free-note">列表由服务器提供，新接入的免费模型会直接出现在这里。</p>
  <p class="free-note" id="free-model-message" role="status" aria-live="polite"></p>
  <div class="actions"><button class="btn" id="free-model-settings" type="button">改用自定义模型（API Key）</button></div>
 </div>
</dialog>
<dialog id="free-model-limits" class="panel" aria-labelledby="free-limits-title">
 <div class="dlg-head"><h2 id="free-limits-title">免费模型的使用限制</h2><button class="btn close" id="free-limits-close" type="button" aria-label="返回">×</button></div>
 <div class="dlg-body">
  <ul>
   <li>每个免费模型同一时间只能一位玩家使用，国内站和海外站共用这个名额。</li>
   <li>名额满了不排队：可以稍后再试，或者换另一个免费模型。</li>
   <li>不想等名额，可以自己去智谱、Bamboo 等平台申请免费的 API Key，填在“自定义模型”里使用。这样不占这里的名额，限额按你在服务商那边的账号算。</li>
   <li id="free-limits-round">每局最多向模型请求 200 次，没成功的请求也算在内。</li>
   <li>全站每小时、每天的免费请求总数也有上限，用完后要等额度恢复。</li>
   <li>开局时固定本局的模型，结算后才能换。</li>
  </ul>
 </div>
</dialog>
<script src="/free-model-picker.js"></script>
