<style>
.contrib{border-top:1px solid var(--walnut,#6b3418);margin-top:24px;padding-top:16px}
.contrib textarea{width:100%;box-sizing:border-box;border:2px solid var(--ink,#2b1a12);font:12px monospace}
.contrib .actions{align-items:center}
</style>
<section aria-labelledby="contribution-title" class="contrib">
 <h3 id="contribution-title">贡献对局数据</h3>
 <p id="contribution-choice" role="status"></p>
 <div class="actions"><button id="contribution-change" class="btn" type="button">查看说明并更改选择</button><button id="contribution-preview" class="btn" type="button">预览数据</button></div>
 <textarea id="contribution-data" readonly hidden rows="8" aria-label="贡献数据预览"></textarea>
 <div class="actions"><button id="contribution-save" class="btn primary" type="button" disabled>贡献已结束的本局</button><button id="contribution-download" class="btn" type="button" hidden>下载删除凭证</button></div>
 <p id="contribution-status" role="status"></p>
 <p><small>不贡献时，服务器仅维持内存会话，闲置 10 分钟后清除；跨局摘要另存在此浏览器。删除凭证也只存在此浏览器，清理网站数据前请先下载备份。</small></p>
 <details class="fine"><summary>删除已贡献数据</summary>
  <p>粘贴删除凭证；持有该凭证即可删除对应数据，请妥善保管。</p>
  <textarea id="contribution-receipt" rows="3" aria-label="删除凭证"></textarea>
  <div class="actions"><button id="contribution-delete" class="btn danger" type="button">删除该记录</button></div>
 </details>
</section>
