# Install only after domain access/filing and public exposure are approved.
# No access logs or request bodies. Rate-limit counters stay in memory.
limit_req_zone $binary_remote_addr zone=chefjeff_session:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=chefjeff_api:1m rate=30r/s;
server {
    listen 80;
    server_name chefjeff.belchingleo.online;
    access_log off;
    error_log /dev/null;
    client_max_body_size 8k;
    client_body_timeout 10s;
    location /.well-known/acme-challenge/ { root /var/www/chefjeff-acme; }
    location / { return 503; }
}
# After certificate issuance: use nginx-https.conf to enable the actual game.
