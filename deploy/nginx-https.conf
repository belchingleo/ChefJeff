limit_req_zone $binary_remote_addr zone=chefjeff_session:1m rate=15r/m;
# Shared networks must accommodate several kitchens. The backend applies the
# stricter 40r/s budget only after validating a session token.
limit_req_zone $binary_remote_addr zone=chefjeff_api:1m rate=500r/s;
limit_req_zone $binary_remote_addr zone=chefjeff_delete:1m rate=30r/s;
map $status $chefjeff_asset_cache {
    default "no-store";
    200 "public, max-age=0, must-revalidate";
    304 "public, max-age=0, must-revalidate";
}
# Content-hashed files: cache a year, but never cache an error (e.g. a 404 during a deploy).
map $status $chefjeff_hashed_cache {
    default "no-store";
    200 "public, max-age=31536000, immutable";
    304 "public, max-age=31536000, immutable";
}
# chefjeff.online is the site; www and the earlier chefjeff.belchingleo.online address redirect to it, so
# links already shared keep working (the old certificate stays only for that redirect).
server {
    listen 80;
    server_name chefjeff.online www.chefjeff.online chefjeff.belchingleo.online;
    access_log off;
    error_log /dev/null;
    location /.well-known/acme-challenge/ { root /var/www/chefjeff-acme; }
    location / { return 301 https://chefjeff.online$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name www.chefjeff.online;
    ssl_certificate /etc/letsencrypt/live/chefjeff.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chefjeff.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null;
    return 301 https://chefjeff.online$request_uri;
}
server {
    listen 443 ssl http2;
    server_name chefjeff.belchingleo.online;
    ssl_certificate /etc/letsencrypt/live/chefjeff.belchingleo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chefjeff.belchingleo.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null;
    return 301 https://chefjeff.online$request_uri;
}
# HTTP/2 multiplexes the page's ~70 startup requests on one connection; `listen ... http2`
# works on Ubuntu's Nginx 1.18/1.24 (1.25+ also accepts it, with a deprecation notice).
server {
    listen 443 ssl http2;
    server_name chefjeff.online;
    ssl_certificate /etc/letsencrypt/live/chefjeff.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chefjeff.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null;
    client_max_body_size 8k;
    client_body_timeout 10s;
    send_timeout 15s;
    add_header Strict-Transport-Security "max-age=86400" always;
    gzip on;
    # Python 3.12 serves .js as text/javascript; include both common MIME types.
    gzip_types application/json application/javascript text/javascript text/css;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    proxy_set_header Host chefjeff.online;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    # The backend limits active kitchens per network; always overwrite any client-sent value.
    proxy_set_header X-ChefJeff-Client $remote_addr;
    proxy_read_timeout 30s;
    # Research previews/downloads must never spool private responses to proxy temp files.
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    location = /api/session {
        limit_req zone=chefjeff_session burst=10 nodelay;
        proxy_pass http://127.0.0.1:8780;
    }
    location /api/ {
        limit_req zone=chefjeff_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:8780;
    }
    # Deletion receipts do not require a live page session; retain their
    # previous IP budget rather than widening anonymous database traffic.
    location = /api/contribution/delete {
        limit_req zone=chefjeff_delete burst=30 nodelay;
        proxy_pass http://127.0.0.1:8780;
    }
    location = /api/contribution/download {
        limit_req zone=chefjeff_delete burst=30 nodelay;
        proxy_pass http://127.0.0.1:8780;
    }
    # Operational metrics stay loopback-only behind this public entry.
    location ^~ /ops/ { return 404; }
    location = /hosted-agent.js {
        proxy_set_header Host chefjeff.online;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Sec-Fetch-Site "";
        proxy_set_header X-ChefJeff-Client $remote_addr;
        proxy_pass http://127.0.0.1:8780;
    }
    # Release builds name files by content (md5Cache: name.<5 hex>.ext): a changed file gets a new
    # name, so these never need revalidation. Unhashed files below keep checking for updates.
    # Quoted: a bare {5} would end the directive.
    location ~ "^/(?:[^/]+|(?:assets|cocos-js|src)/.+)\.[0-9a-f]{5}\.(?:js|css|json|png|jpg|webp|mp3|wasm|bin|cconb)$" {
        root /opt/chefjeff/current/cocos-kitchen/build/web;
        try_files $uri =404;
        types {
            application/javascript js;
            application/json json;
            text/css css;
            image/png png;
            image/jpeg jpg;
            image/webp webp;
            audio/mpeg mp3;
            application/wasm wasm;
            application/octet-stream bin cconb;
        }
        etag on;
        add_header Cache-Control $chefjeff_hashed_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=86400" always;
    }
    # Only public build assets, never the runtime or private contribution data.
    location ~ ^/(?:[^/]+|(?:assets|cocos-js|src|fonts)/.+)\.(?:js|css|json|png|jpg|webp|ico|woff|woff2|ttf|mp3|wasm|bin|cconb)$ {
        root /opt/chefjeff/current/cocos-kitchen/build/web;
        try_files $uri =404;
        types {
            application/javascript js;
            application/json json;
            text/css css;
            image/png png;
            image/jpeg jpg;
            image/webp webp;
            image/x-icon ico;
            font/woff woff;
            font/woff2 woff2;
            font/ttf ttf;
            audio/mpeg mp3;
            application/wasm wasm;
            application/octet-stream bin cconb;
        }
        etag on;
        add_header Cache-Control $chefjeff_asset_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=86400" always;
    }
    # Explicit Jev or Cloudflare consent sends a key in the body. Stream this bounded body
    # without Nginx request/response temporary files; retain origin/session checks.
    location ~ ^/api/model/(jev|cloudflare)$ {
        limit_req zone=chefjeff_api burst=30 nodelay;
        client_max_body_size 12k;
        client_body_buffer_size 16k;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8780;
    }
    location / {
        # Public pages/assets must open from links on other sites. Keep the
        # original Origin header; /api/ retains the stricter Fetch Metadata check.
        # Defining headers here replaces, rather than extends, server inheritance.
        proxy_set_header Host chefjeff.online;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Sec-Fetch-Site "";
        proxy_set_header X-ChefJeff-Client $remote_addr;
        proxy_pass http://127.0.0.1:8780;
    }
}
