limit_req_zone $binary_remote_addr zone=chefjeff_session:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=chefjeff_api:1m rate=30r/s;
server {
    listen 80;
    server_name chefjeff.belchingleo.online;
    access_log off;
    error_log /dev/null;
    location /.well-known/acme-challenge/ { root /var/www/chefjeff-acme; }
    location / { return 301 https://chefjeff.belchingleo.online$request_uri; }
}
server {
    listen 443 ssl;
    server_name chefjeff.belchingleo.online;
    ssl_certificate /etc/letsencrypt/live/chefjeff.belchingleo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chefjeff.belchingleo.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null;
    client_max_body_size 8k;
    client_body_timeout 10s;
    send_timeout 15s;
    add_header Strict-Transport-Security "max-age=86400" always;
    gzip on;
    # Python 3.12 serves .js as text/javascript; include both common MIME types.
    gzip_types application/json application/javascript text/javascript text/css;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    proxy_set_header Host chefjeff.belchingleo.online;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_read_timeout 30s;
    location = /api/session {
        limit_req zone=chefjeff_session burst=2 nodelay;
        proxy_pass http://127.0.0.1:8780;
    }
    location /api/ {
        limit_req zone=chefjeff_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8780;
    }
    # Explicit Jev consent sends a key in the body. Stream this bounded body
    # without Nginx request/response temporary files; retain origin/session checks.
    location = /api/model/jev {
        limit_req zone=chefjeff_api burst=30 nodelay;
        client_max_body_size 4k;
        client_body_buffer_size 8k;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8780;
    }
    location / {
        # Public pages/assets must open from links on other sites. Keep the
        # original Origin header; /api/ retains the stricter Fetch Metadata check.
        # Defining headers here replaces, rather than extends, server inheritance.
        proxy_set_header Host chefjeff.belchingleo.online;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Sec-Fetch-Site "";
        proxy_pass http://127.0.0.1:8780;
    }
}
