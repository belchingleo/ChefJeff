name: Offline rules and API tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Nginx for proxy integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
      - name: Install offline test tools
        run: |
          npm ci
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install Chromium for the private console browser check
        if: matrix.python == '3.12'
        run: npx playwright install --with-deps chromium
      - run: node tests/hosted_browser_test.cjs
      - run: node tests/hosted_memory_browser_test.cjs
      - run: node tests/hosted_usage_browser_test.cjs
      - run: node tests/auto_contribution_test.cjs
      - run: node tests/presentation_loading_test.cjs
      - run: node tests/settings_locale_test.cjs
      - run: node tests/mobile_controls_test.cjs
      - run: node tests/gamepad_controls_test.cjs
      - run: python -m unittest discover -s tests
      - name: Private console TLS, selection, preview and chart browser checks
        if: matrix.python == '3.12'
        run: python tests/run_admin_browser.py
      - run: python scripts/audit_release.py
